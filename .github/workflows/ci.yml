name: ci

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,notebooks]"
      - name: Unit tests
        run: pytest
      - name: Validate standalone HTML tools
        run: python scripts/validate_html.py tools/open_quantum_order_lab.html tools/mmals_path_memory_lab.html
      - name: Execute notebooks
        run: |
          mkdir -p build/executed-notebooks
          jupyter nbconvert --to notebook --execute notebooks/01_open_quantum_geometry.ipynb --output-dir build/executed-notebooks --output 01_open_quantum_geometry.executed.ipynb --ExecutePreprocessor.timeout=300
          jupyter nbconvert --to notebook --execute notebooks/02_mmals_path_memory.ipynb --output-dir build/executed-notebooks --output 02_mmals_path_memory.executed.ipynb --ExecutePreprocessor.timeout=300
      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-extra texlive-fonts-recommended
      - name: Build report
        run: make pdf
      - name: Upload verified deliverables
        uses: actions/upload-artifact@v4
        with:
          name: geometric-path-memory-deliverables
          path: |
            docs/Geometric_Path_Memory.pdf
            build/executed-notebooks/*.ipynb
