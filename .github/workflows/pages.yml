name: pages

on:
  push:
    branches: [main]
    paths:
      - "tools/**"
      - "docs/**"
      - "site/**"
      - "Makefile"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-extra texlive-fonts-recommended
      - name: Compile report
        run: make pdf
      - name: Assemble static site
        run: |
          mkdir -p _site/tools _site/report
          cp site/index.html _site/index.html
          cp tools/*.html _site/tools/
          cp docs/Geometric_Path_Memory.pdf _site/report/Geometric_Path_Memory.pdf
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
