name: bootstrap-full-package

on:
  push:
    branches: [main]
    paths:
      - BOOTSTRAP_READY

permissions:
  contents: write

jobs:
  import-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct package archive
        run: |
          cat .bootstrap/package.b64.part-* > /tmp/mmals-package.b64
          base64 --decode /tmp/mmals-package.b64 > /tmp/mmals-package.zip
          echo "2bd4181981359149268816f4bc86ae006eda21f8f2ee96082e2ef8782508a131  /tmp/mmals-package.zip" | sha256sum --check -
          mkdir -p /tmp/mmals-package
          unzip -q /tmp/mmals-package.zip -d /tmp/mmals-package
      - name: Import repository contents
        run: |
          cp -a /tmp/mmals-package/mmals-geometric-path-memory/. .
          rm -rf .bootstrap BOOTSTRAP_READY .github/workflows/bootstrap-package.yml
      - name: Commit full package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import full geometric path memory package"
          git push
