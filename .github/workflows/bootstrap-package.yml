name: bootstrap-full-package

on:
  push:
    branches: [main]
    paths:
      - BOOTSTRAP_READY

permissions:
  contents: write

jobs:
  import-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct package archive
        run: |
          cat .bootstrap/package.b64.part-* > /tmp/mmals-package.b64
          base64 --decode /tmp/mmals-package.b64 > /tmp/mmals-package.tar.xz
          echo "1c18cc4b91611a0a2b914cf424e4ee74d21d342bb35245f5c979587ef2147604  /tmp/mmals-package.tar.xz" | sha256sum --check -
          mkdir -p /tmp/mmals-package
          tar -xJf /tmp/mmals-package.tar.xz -C /tmp/mmals-package
      - name: Import repository contents
        run: |
          cp -a /tmp/mmals-package/mmals-geometric-path-memory/. .
          rm -rf .bootstrap BOOTSTRAP_READY .github/workflows/bootstrap-package.yml
      - name: Commit full package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import full geometric path memory package"
          git push
